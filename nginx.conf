map $http_x_webdav_target $webdav_dynamic_target {
    default "";
    ~^https?://[^\s]+$ $http_x_webdav_target;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1g;

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # 静态资源缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebDAV 动态代理（由前端通过 X-WebDAV-Target 指定上游地址）
    location = /webdav-proxy {
        if ($webdav_dynamic_target = "") {
            return 400;
        }

        add_header X-WebDAV-Proxy 1 always;
        proxy_pass $webdav_dynamic_target;
        proxy_set_header Host $proxy_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-WebDAV-Target "";
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

}
